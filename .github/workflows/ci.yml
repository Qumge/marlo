# App CI — the coworker Python suite, the GUI unit tests, and the hermetic
# Playwright e2e suite (mocked /v1 + WS; no model or network needed).

name: CI

on:
  push:
  pull_request:
  # 只给 model-drift 用 —— 它要出网，而上面那三个 job 是 hermetic 的。漂移是按
  # qumge 的时钟发生的，不是按我们提交的时钟：挂在 push 上只是把同一件事查一百遍，
  # 每天查一次就能在一天之内发现。
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # -c requirements-ci.txt：CI 装的永远是锁里写死的版本。
          # 没有它的时候，pyproject 里那些没上界的依赖会让 CI 每天装到不同的东西 ——
          # 2026-07-28 mcp 2.0.0 发布当天，CI 就换成了一个删掉我们用的符号的版本，
          # 之后三次运行一条测试都没真正跑过。见 requirements-ci.txt 头部。
          #
          # bedrock 这个 extra 是上游 0.1.7 带来的。boto3 在 bedrock_provider.py 里
          # 是函数体内 import，所以【模块】不带它也能 import —— 但 test_bedrock_provider
          # 有 4 条测试真的要 boto3/botocore，不装就是 ModuleNotFoundError。
          #
          # 加 extra 的同时锁也重新生成过（--extra bedrock，并且拿旧锁当约束），
          # 所以这次只多了 boto3/botocore/jmespath/s3transfer 四行，没有顺带升级
          # 任何不相关的包。不这么做的话 uv 会整份重新求解，把 cryptography、
          # fastapi、openai 一起抬上去 —— 那种升级要单独一个提交，不该混在
          # 「合上游」里。
          pip install -e ".[messaging,dev,bedrock]" -c requirements-ci.txt
      - name: Test
        run: pytest tests -q

  gui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Unit tests
        working-directory: surfaces/gui
        run: npm test

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Install Playwright browsers
        working-directory: surfaces/gui
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: surfaces/gui
        run: npm run e2e

  # 我们写死的 qumge 模型 id，在网关上是不是真的存在。
  #
  # 【为什么单独一个 job、还只在定时/手动时跑】上面三个是 hermetic 的（见文件头），
  # 这一个必须出网。混进去等于把 CI 的可靠性押在 qumge 的可达性上，网络抖一下就红，
  # 红得多了就没人看了。
  # 脚本自己也守着这条线：连不上 / 网关没返回东西都退出 0，只有【真的查到清单、
  # 而某个 id 不在里面】才退出 1。
  model-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c requirements-ci.txt
      - name: Check qumge model ids against the live gateway
        run: python packaging/check_model_matrix.py
