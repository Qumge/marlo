# Desktop release builds — macOS (.dmg, arm64 + Intel) and Windows (.msi + NSIS .exe).
#
# CI calls the SAME scripts developers run locally (packaging/build_dmg.sh and
# build_windows.ps1); this file only provisions the toolchain (Node, Rust, a Python venv at
# .venv with PyInstaller) and publishes the results.
#
# Triggers:
#   - tag push `v*`  → builds all targets and attaches them to a DRAFT GitHub Release
#                      (review, then publish by hand).
#   - manual run     → builds and uploads workflow artifacts only (no release).
#
# Each installer is uploaded twice: once with its versioned name (archive) and once with a
# stable name (Marlo-macos-arm64.dmg, …) so the website can link to
#   github.com/<repo>/releases/latest/download/<stable-name>
# and never need updating.
#
# macOS signing + notarization: Tauri's bundler handles both during `tauri build` when the
# APPLE_* env vars are present (import cert → sign app + sidecar with hardened runtime →
# notarize via notarytool → staple). Driven by repo secrets:
#   APPLE_CERTIFICATE            base64 .p12 (Developer ID Application cert + key)
#   APPLE_CERTIFICATE_PASSWORD   the .p12 export password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_CONTENT        base64 App Store Connect API .p8 (notarytool)
#   APPLE_API_KEY                the API key id
#   APPLE_API_ISSUER             the API issuer id
# When the secrets are absent (forks, scratch runs) the build degrades to unsigned —
# installable via `xattr -cr`. Windows remains unsigned (Authenticode is a later step).

name: Release

on:
  push:
    tags: ["v*", "app-v*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            slug: macos-arm64
          # Intel macOS: macos-13 retired in Dec 2025; macos-15-intel replaced it and is
          # the LAST x86_64 image Actions will offer (available until Aug 2027). Builds
          # natively — the sidecar is a PyInstaller freeze, which cannot cross-compile.
          - os: macos-15-intel
            slug: macos-x64
          - os: windows-latest
            slug: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: surfaces/gui/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the sidecar venv (.venv)
        # The build scripts expect a venv at .venv with the package + PyInstaller.
        # typer/tzdata are build-time-only (PyInstaller walks mcp.cli, which needs typer;
        # tzdata ships zoneinfo for Windows). aisuite installs like any other dependency
        # (git-pinned in pyproject.toml).
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=.venv/Scripts/python; else VPY=.venv/bin/python; fi
          "$VPY" -m pip install --upgrade pip
          # pillow: build_dmg.sh redraws the installer background from
          # make_dmg_background.py rather than trusting a committed PNG — the
          # product name is inside that picture, and it was wrong for eleven
          # releases because nothing can read a binary. 现在它还负责
          # make_tray_icon.py 那条菜单栏图标的重采样。
          #
          # [bedrock]：发版的 sidecar 要真能连 Bedrock，boto3 得打进冻结的二进制
          # 里（那里没有解释器可以运行时 pip install），所以这个 extra 和 CI 那边
          # 不同——发版必须带，CI 不必带。
          "$VPY" -m pip install -e ".[bedrock]" pyinstaller typer tzdata pillow
          "$VPY" -c "import aisuite, coworker"  # fail fast if either import breaks

      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci

      - name: Build .dmg (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Auto-update artifact signing (minisign, separate from Apple signing). Absent →
          # the build script skips updater artifacts with a warning (fork/scratch runs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Unset empty APPLE_* vars so runs without secrets stay cleanly unsigned
          # (Tauri treats a present-but-empty var as a config error).
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            [ -n "$(eval echo "\${$v:-}")" ] || unset "$v"
          done
          if [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
            echo "$APPLE_API_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          unset APPLE_API_KEY_CONTENT
          bash packaging/build_dmg.sh

      - name: Build .msi + NSIS .exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./packaging/build_windows.ps1

      - name: Stage artifacts (versioned + stable names)
        run: |
          mkdir -p out
          BUNDLE=surfaces/gui/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$BUNDLE"/nsis/*.exe out/
            cp "$BUNDLE"/nsis/*.exe out/Marlo-windows-setup.exe
            cp "$BUNDLE"/msi/*.msi out/
            cp "$BUNDLE"/msi/*.msi out/Marlo-windows.msi
            # Updater signature for the NSIS installer (present only when the updater key
            # secret is configured). The .sig signs CONTENT, so the stable rename is safe.
            SIG=$(ls "$BUNDLE"/nsis/*.exe.sig 2>/dev/null | head -1 || true)
            [ -n "$SIG" ] && cp "$SIG" out/Marlo-windows-setup.exe.sig
          else
            cp "$BUNDLE"/dmg/*.dmg out/
            cp "$BUNDLE"/dmg/*.dmg out/Marlo-${{ matrix.slug }}.dmg
            # macOS updater artifact: the signed .app tarball the installed app swaps in.
            if [ -f "$BUNDLE"/macos/Marlo.app.tar.gz ]; then
              cp "$BUNDLE"/macos/Marlo.app.tar.gz out/Marlo-${{ matrix.slug }}.app.tar.gz
              cp "$BUNDLE"/macos/Marlo.app.tar.gz.sig out/Marlo-${{ matrix.slug }}.app.tar.gz.sig
            fi
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose the auto-update manifest (latest.json)
        # Shipped apps poll this repo's releases/latest/download/latest.json —
        # publishing this release IS pushing the update.
        # The tag must match the version that gets stamped into the bundle, or installed
        # apps would see a permanent phantom update; fail loudly on drift. Runs only when
        # signed updater artifacts exist (i.e. the TAURI_SIGNING_PRIVATE_KEY secret is set).
        #
        # 读的是 tauri.marlo.conf.json，不是 tauri.conf.json —— 后者现在和上游字节相同，
        # 里面躺着【上游的】版本号。构建时 --config 让 overlay 覆盖它，所以 overlay 才是
        # 真正 stamp 进 bundle 的那个。
        run: |
          TAG="${GITHUB_REF_NAME}"
          CONF="surfaces/gui/src-tauri/tauri.marlo.conf.json"
          CONF_VERSION=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$CONF")
          if [ "${TAG#v}" != "$CONF_VERSION" ]; then
            echo "::error::tag $TAG != $CONF version $CONF_VERSION — bump the overlay before tagging"
            exit 1
          fi
          if ls dist/*.sig >/dev/null 2>&1; then
            # R2_PUBLIC_BASE 配了，清单里的下载地址就指向镜像。github.com 在国内
            # 直连不通（30 秒超时），而清单和安装包原本全在 GitHub 上——没有代理的
            # 用户装不上也更新不了。没配就回落到 GitHub（fork 照常工作）。
            python3 packaging/make_update_manifest.py \
              --version "${TAG#v}" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dist dist --out dist/latest.json \
              --base-url "${{ secrets.R2_PUBLIC_BASE }}" \
              --notes "Marlo ${TAG#v}"
          else
            echo "::warning::no updater signatures in dist/ — release ships WITHOUT auto-update manifest"
          fi

      # 把产物推到 R2 镜像。GitHub 那份【照旧保留】——镜像是给够不着 GitHub 的人
      # 用的第二条路，不是替代；两边都在，任何一边挂了还有另一边。
      #
      # 密钥缺失就跳过（和上面 Apple 签名同样的降级方式）：fork 和 scratch 构建
      # 不该因为拿不到我们的存储凭据而失败。
      #
      # 上传【必须在发布之前】：清单里的 URL 已经指向镜像了，先发布再上传的话，
      # 中间那段时间里所有收到更新提示的人都会下到 404。
      - name: Mirror the artifacts to R2
        # 【不要用 if: secrets.X != ''】——`secrets` 上下文在 step 的 if 里不可用，
        # 那个条件恒为假，这一步会永远被跳过而没有任何提示。在脚本里判断，并且
        # 缺密钥时打一条 ::warning::，跳过要能被看见。
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "::warning::R2 密钥未配置 —— 这次发布【没有镜像】，够不着 GitHub 的用户装不上也更新不了"
            exit 0
          fi
          # Cloudflare 控制台里"S3 API"那一栏给的地址【有时带着桶名】
          # （https://<account>.r2.cloudflarestorage.com/<bucket>）。原样传给
          # --endpoint-url 的话，对象会落到 <bucket>/<bucket>/… 去。剥掉它 ——
          # 与其指望填的人记得，不如让两种写法都对。
          R2_ENDPOINT="${R2_ENDPOINT%/}"
          R2_ENDPOINT="${R2_ENDPOINT%/$R2_BUCKET}"
          echo "endpoint=$R2_ENDPOINT bucket=$R2_BUCKET"
          # 按 tag 归档一份（清单指向这里，版本永远对得上）……
          aws s3 cp dist/ "s3://$R2_BUCKET/marlo/$TAG/" \
            --endpoint-url "$R2_ENDPOINT" --recursive --no-progress
          # R2 按扩展名猜 content-type，.tar.gz 被猜成 application/x-tar ——
          # 一个 gzip 压缩包被标成未压缩的 tar。GitHub 给的是
          # application/octet-stream。字节本身是对的（魔数 1f8b），但一个按
          # content-type 决定怎么解包的客户端会在这里翻车。改成 application/gzip
          # 而不是照抄 octet-stream：它是这个文件真实的类型。
          for t in dist/*.app.tar.gz; do
            [ -f "$t" ] || continue
            aws s3 cp "$t" "s3://$R2_BUCKET/marlo/$TAG/$(basename "$t")" \
              --endpoint-url "$R2_ENDPOINT" --content-type application/gzip \
              --metadata-directive REPLACE --no-progress
          done
          # ……另一份放在稳定路径下，给网站的下载按钮和 updater 的入口用。
          #
          # 【必须显式给短缓存】。marlo/latest/ 下的文件名【永远不变】而内容每次
          # 发版都变 —— 它是一个可变指针，不是内容。Cloudflare 默认给 dmg/exe
          # 这类扩展名 4 小时的边缘缓存，于是发版之后官网的下载按钮会继续发【上
          # 一个版本】最长 4 小时。
          #
          # 2026-07-28 发 0.4.3 时实测：latest/latest.json 是 DYNAMIC（不缓存，
          # 所以更新器一切正常），而 latest/Marlo-macos-arm64.dmg 是 HIT、age
          # 4701、last-modified 停在 0.4.1 的上传时间。源站是对的，边缘是旧的。
          # 更新器不受影响（它读清单，清单指向 v<tag>/），受影响的是【新用户从
          # 官网下载】这条路 —— 也就是获客那条。
          #
          # marlo/$TAG/ 那份【不动】：那个前缀里的内容永远不变，长缓存是对的。
          for f in dist/Marlo-macos-arm64.dmg dist/Marlo-windows-setup.exe \
                   dist/Marlo-windows.msi dist/latest.json; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://$R2_BUCKET/marlo/latest/$(basename "$f")" \
              --endpoint-url "$R2_ENDPOINT" --no-progress \
              --cache-control "public, max-age=60, must-revalidate"
          done
          echo "镜像完成：$TAG"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
